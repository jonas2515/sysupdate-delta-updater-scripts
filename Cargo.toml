[package]
name = "sysupdate-delta-updater-scripts"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "get_delta_info"
path = "src/get_delta_info/main.rs"

[[bin]]
name = "create_delta_manifest"
path = "src/create_delta_manifest/main.rs"

[[bin]]
name = "dump_delta_manifest"
path = "src/dump_delta_manifest/main.rs"

[[bin]]
name = "update_image"
path = "src/update_image/main.rs"

[[bin]]
name = "update_image_downloading"
path = "src/update_image_downloading/main.rs"

[[bin]]
name = "test_pull_server"
path = "src/varlink_test_server_client/test_pull_server.rs"

[[bin]]
name = "test_pull_client"
path = "src/varlink_test_server_client/test_pull_client.rs"

[[bin]]
name = "updater_prototype"
path = "src/updater_prototype/main.rs"

[[bin]]
name = "manifest_backwards_compat_tests"
path = "src/manifest_backwards_compat_tests/main.rs"

[dependencies]
bytes = "1.11.0"
crc-fast = "1.8.0"
curl = "0.4.49"
env_logger = "0.11.8"
futures = "0.3.31"
log = "0.4.29"
multipart_async_stream = "0.2.4"
reqwest = { version = "0.12.24", features = ["rustls-tls", "stream"] }
serde = "1.0.228"
tokio = { version = "1.48.0", features = ["full"] }
zlink = "0.2.0"
libcryptsetup-rs = "0.14.0"
uuid = "1.19.0"
sha2 = { version = "0.10.9", features = ["asm-aarch64", "asm"] }
rmp-serde = "1.3.1"
serde_bytes = "0.11.19"
zvariant = { version = "5.9.1", features = ["gvariant", "serde_bytes"] }

[patch.crates-io]
libcryptsetup-rs = { path = "../libcryptsetup-rs" }
